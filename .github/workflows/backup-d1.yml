name: Backup LIMFXAI D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limfxai-production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Export remote D1 database
        run: npx wrangler d1 export limfxai-db --remote --skip-confirmation --output=./limfxai-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: limfxai-d1-backup-${{ github.run_id }}
          path: ./limfxai-backup.sql
          if-no-files-found: error
          retention-days: 7
