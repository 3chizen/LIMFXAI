name: Migrate LIMFXAI D1

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: limfxai-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Worker tests
        run: node --test tests/worker.test.js

      - name: Apply D1 migrations (manual workflow only)
        run: npx wrangler d1 migrations apply limfxai-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
