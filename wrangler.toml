name = "limfxai-agent-engine"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "limfxai-db"
database_id = "d270b313-37b3-4503-9182-2950a696f831"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
XAI_MODEL = "grok-3-mini"
RPC_ETHEREUM = "https://api.blockvectra.com/v1/eth_mainnet/public"
RPC_BNB = "https://bsc-rpc.publicnode.com"
RPC_BASE = "https://base-rpc.publicnode.com"
RPC_ARBITRUM = "https://arbitrum-one-rpc.publicnode.com"
RPC_SOLANA = "https://api.mainnet-beta.solana.com"
# Configure SESSION_SECRET with `wrangler secret put SESSION_SECRET` for production.
